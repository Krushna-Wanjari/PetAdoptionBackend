spring.application.name=PetAdoption

# ---------- Server ----------
server.port=8080

# ---------- Secrets / local overrides ----------
# Real environment variables always win. A gitignored .env file next to
# mvnw is imported if present, so local credentials never have to be
# committed. Copy .env.example -> .env and fill in your values.
spring.config.import=optional:file:.env[.properties]

# ---------- Database (MySQL) ----------
# NOTE: allowPublicKeyRetrieval=true is required by MySQL 8 + Connector/J when
# the account uses caching_sha2_password (the default auth plugin). Without it
# the driver fails with "Public Key Retrieval is not allowed" and the app
# refuses to start.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pet_adoption?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# IMPORTANT: change this secret before deploying anywhere real.
# It must be at least 32 characters (256 bits) for HS256.
jwt.secret=${JWT_SECRET:replace-this-with-a-long-random-secret-at-least-32-chars-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- Cloudinary (pet image uploads) ----------
# Get these from your Cloudinary dashboard: https://console.cloudinary.com/ -> Dashboard
# Leave blank to run without Cloudinary: image upload endpoints will then return
# 503 instead of failing at startup, and the rest of the API keeps working.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ---------- File upload limits ----------
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}

# ---------- Seed data ----------
# Creates a default admin account on startup if one doesn't already exist.
# Override the password in .env (or set ADMIN_PASSWORD) before deploying.
app.seed.admin-email=${ADMIN_EMAIL:admin@petadoption.com}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}
# When true, the seeded admin's password is forced to match
# app.seed.admin-password on every startup. Convenient locally, but it would
# reset a real admin's password on restart - keep it false outside development.
app.seed.admin-sync-password=${ADMIN_SYNC_PASSWORD:false}

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
